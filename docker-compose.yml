services:
  frontend:
    build: ./frontend
    ports:
      - "8080:10000"
    environment:
      BACKEND_HOSTPORT: backend:8000
      NGINX_ENVSUBST_FILTER: ^BACKEND_HOSTPORT$
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      AI_ENGINE_URL: http://ai-engine:8100
      AI_ENGINE_TIMEOUT_SECONDS: 35
    depends_on:
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-engine:
    build: ./ai-engine
    expose:
      - "8100"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
