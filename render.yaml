services:
  - type: pserv
    name: algoviz-ai-engine
    runtime: docker
    rootDir: ai-engine
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false

  - type: pserv
    name: algoviz-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: BACKEND_PORT
        value: "8000"
      - key: AI_ENGINE_URL
        fromService:
          type: pserv
          name: algoviz-ai-engine
          property: hostport
      - key: AI_ENGINE_TIMEOUT_SECONDS
        value: "35"

  - type: web
    name: algoviz-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: BACKEND_HOSTPORT
        fromService:
          type: pserv
          name: algoviz-backend
          property: hostport
      - key: NGINX_ENVSUBST_FILTER
        value: ^BACKEND_HOSTPORT$
